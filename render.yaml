# =============================================================================
# Render Blueprint — Procedural 3D Asset Generator Studio (Zero-Error Deploy)
# =============================================================================
services:
  - type: web
    name: assets-gen-pro
    runtime: python
    plan: free
    buildCommand: pip install --upgrade pip setuptools wheel && pip install --only-binary=:all: -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.11"
      - key: PYTHONUNBUFFERED
        value: "true"
      - key: STUDIO_GENERATION_ENGINE
        value: auto
      - key: STUDIO_MAX_CONCURRENT_JOBS
        value: "1"
      - key: STUDIO_JOB_TIMEOUT_SECONDS
        value: "180"
