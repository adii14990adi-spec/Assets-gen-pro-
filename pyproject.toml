[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "procedural-3d-asset-forge"
version = "2.0.0"
description = "Code-only procedural 3D asset pipeline: Python (NumPy/SciPy/Trimesh) generators in GitHub Actions producing .glb models for a static Three.js gallery on GitHub Pages."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "GPL-3.0-or-later" }
dependencies = [
    "numpy>=1.26.4,<3.0.0",
    "scipy>=1.11.4,<2.0.0",
    "trimesh>=4.0.0,<6.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0,<9.0.0",
    "ruff>=0.11.0,<1.0.0",
    "PyYAML>=6.0.1,<7.0.0",
]

[tool.setuptools]
py-modules = []

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["public/assets"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]
