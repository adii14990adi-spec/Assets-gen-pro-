<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Assets Gen Pro — procedural SVG assets</title>
<meta name="description" content="Generate deterministic, seed-based SVG assets: mesh gradients, patterns, identicons, badges and placeholders.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%237c5cff'/%3E%3Ccircle cx='12' cy='12' r='4' fill='%23fff'/%3E%3Ccircle cx='21' cy='20' r='5' fill='%2338e0a5'/%3E%3C/svg%3E">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <span class="logo" aria-hidden="true"></span>
    <div>
      <h1>Assets Gen Pro</h1>
      <p class="tagline">Deterministic procedural SVG assets, straight from a seed.</p>
    </div>
  </div>
  <a class="doclink" href="/docs" target="_blank" rel="noopener">API docs ↗</a>
</header>

<main class="layout">
  <aside class="panel controls" aria-label="Generator controls">
    <section class="field">
      <h2>Kind</h2>
      <div class="kinds" id="kinds" role="tablist" aria-label="Asset kind"></div>
      <p class="hint" id="kind-desc"></p>
    </section>

    <section class="field">
      <label for="seed">Seed</label>
      <div class="row">
        <input id="seed" name="seed" value="aurora" autocomplete="off" spellcheck="false">
        <button class="icon-btn" id="dice" type="button" title="Random seed" aria-label="Random seed">🎲</button>
      </div>
      <p class="hint">Same seed + settings always produce the same asset.</p>
    </section>

    <section class="field two">
      <div>
        <label for="palette">Palette</label>
        <select id="palette"></select>
      </div>
      <div>
        <label for="size">Size</label>
        <select id="size">
          <option>256</option>
          <option selected>400</option>
          <option>512</option>
          <option>800</option>
          <option>1024</option>
        </select>
      </div>
    </section>

    <section class="field" id="param-wrap">
      <h2>Options</h2>
      <div id="params" class="params"></div>
    </section>

    <section class="field">
      <h2>Batch</h2>
      <p class="hint">Variations derived from the current seed.</p>
      <button class="primary" id="batch-btn" type="button">Generate 8 variations</button>
      <div class="batch" id="batch"></div>
    </section>
  </aside>

  <section class="stage">
    <div class="preview-card">
      <div class="preview-head">
        <div>
          <span class="pill" id="kind-pill">mesh</span>
          <span class="muted" id="preview-meta">400 × 400 · vivid</span>
        </div>
        <div class="actions">
          <button class="ghost" id="copy" type="button">Copy SVG</button>
          <button class="ghost" id="dl-svg" type="button">SVG</button>
          <button class="ghost" id="dl-png" type="button">PNG</button>
        </div>
      </div>
      <div class="preview" id="preview">
        <img id="asset" alt="Generated asset preview" width="400" height="400">
        <div class="swatches" id="swatches" aria-hidden="true"></div>
      </div>
      <p class="status" id="status" role="status" aria-live="polite"></p>
    </div>

    <div class="preview-card">
      <div class="preview-head">
        <h2>Embed</h2>
        <span class="muted">stable URL — cache-friendly</span>
      </div>
      <pre class="snippet"><code id="snippet"></code></pre>
    </div>
  </section>
</main>

<script src="app.js"></script>
</body>
</html>
