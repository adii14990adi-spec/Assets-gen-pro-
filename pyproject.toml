[project]
name = "procedural-3d-asset-studio"
version = "1.0.0"
description = "Procedural 3D Asset Generator Studio for Godot 4 Android Battle Royale pipelines using Python, Blender 4.2 LTS, NumPy, Geometry Nodes, and React Three Fiber."
readme = "README.md"
requires-python = ">=3.11,<3.13"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]
