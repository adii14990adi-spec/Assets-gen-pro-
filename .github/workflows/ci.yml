name: CI — Build, Test & Verify Dual-Engine 3D Pipeline

on:
  push:
    branches:
      - main
      - "arena/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # -------------------------------------------------------------------------
  frontend:
    name: Frontend TypeScript, Tests & Vite Build
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run TypeScript type check
        run: npm run typecheck

      - name: Run frontend unit & GLB loader tests
        run: npm test

      - name: Build production frontend bundle
        run: npm run build

      - name: Upload frontend dist artifact
        uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7

  # -------------------------------------------------------------------------
  # Backend gate: proves the Render Native Python path — wheel-only install
  # on the pinned Python 3.11.11 and the full pytest suite on the
  # pure-Python fallback engine (no Blender installed in this job).
  # -------------------------------------------------------------------------
  backend:
    name: Backend Python 3.11 (wheel-only) + Python Fallback Engine E2E
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python (pinned via .python-version)
        uses: actions/setup-python@v7
        with:
          python-version-file: ".python-version"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies from binary wheels ONLY (Render parity)
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip setuptools wheel
          # --only-binary proves no package (numpy/scipy included) ever
          # falls back to a source build requiring gcc/gfortran.
          .venv/bin/pip install --only-binary=:all: -r requirements-dev.txt
          .venv/bin/python -c "import numpy, scipy, trimesh, fastapi; print('numpy', numpy.__version__, '| scipy', scipy.__version__, '| trimesh', trimesh.__version__, '| fastapi', fastapi.__version__)"

      - name: Run Ruff Python linter
        run: .venv/bin/ruff check backend scripts tests app.py main.py

      - name: Validate preset schemas & asset type catalog
        run: |
          .venv/bin/python -c "
          from backend.generator.catalog import list_asset_types, list_presets
          types = list_asset_types()
          presets = list_presets()
          assert len(types) == 4, f'Expected 4 categories, got {len(types)}'
          assert len(presets) >= 17, f'Expected >=17 presets, got {len(presets)}'
          print(f'Validated {len(types)} categories and {len(presets)} presets successfully.')
          "

      - name: Verify dual-engine selection without Blender
        run: |
          .venv/bin/python -c "
          from backend.blender.runtime import describe_generation_engine, select_generation_engine
          info = describe_generation_engine()
          print('Engine info:', info)
          assert info['python_fallback_available'] is True
          assert select_generation_engine() in ('blender', 'python_fallback')
          "

      - name: Run full pytest suite (Python fallback engine)
        run: |
          mkdir -p ci_artifacts/reports
          .venv/bin/pytest --junitxml=ci_artifacts/reports/pytest-junit.xml -v

      - name: Generate & validate sample Haveli GLB (Python engine)
        run: |
          mkdir -p ci_artifacts/sample_asset
          .venv/bin/python scripts/cli_generate.py \
            --engine python \
            --category architecture \
            --preset rajasthani_haveli \
            --quality prototype \
            --seed 1727 \
            --asset-id ci_sample_rajasthani_haveli \
            --output-dir ci_artifacts/sample_asset

      - name: Publish CI summary
        if: always()
        run: |
          echo "### Procedural 3D Asset Studio — Backend Verification (Python Fallback Engine)" >> "$GITHUB_STEP_SUMMARY"
          if [ -f ci_artifacts/sample_asset/ci_sample_rajasthani_haveli_metadata.json ]; then
            .venv/bin/python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          m = json.load(open("ci_artifacts/sample_asset/ci_sample_rajasthani_haveli_metadata.json"))
          print(f"- **Sample Asset**: {m['name']} (`{m['glb_filename']}`, {m['glb_size_bytes']:,} bytes)")
          print(f"- **Generation Engine**: {m['blender_version']} via {', '.join(m['capabilities_used'])}")
          print(f"- **Measured Triangles**: {m['stats']['actual_triangles']:,}")
          print(f"- **Validation Passed**: {m['validation']['valid']}")
          PY
          fi

      - name: Upload test reports & sample GLB
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-reports-and-sample-glb
          path: |
            ci_artifacts/reports/pytest-junit.xml
            ci_artifacts/sample_asset/*.glb
            ci_artifacts/sample_asset/*_metadata.json
          retention-days: 14

  # -------------------------------------------------------------------------
  docker-lite:
    name: Docker Image (runtime-lite) Build & Smoke Test
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Build Blender-free Docker image (Python fallback engine)
        run: docker build --target runtime-lite -t assets-gen-pro:lite .

      - name: Smoke test container health, UI & generation API
        run: |
          docker run -d --name studio -p 8000:8000 -e PORT=8000 assets-gen-pro:lite
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8000/api/health > /tmp/health.json; then break; fi
            sleep 2
          done
          cat /tmp/health.json
          curl -fsS http://127.0.0.1:8000/ | grep -qi "Procedural 3D" && echo "Root UI OK"
          python3 - <<'PY'
          import json, struct, time, urllib.request

          def call(path, method="GET", body=None):
              data = json.dumps(body).encode() if body is not None else None
              req = urllib.request.Request(f"http://127.0.0.1:8000{path}", data=data, method=method)
              if data:
                  req.add_header("Content-Type", "application/json")
              with urllib.request.urlopen(req, timeout=30) as resp:
                  return json.loads(resp.read() or b"{}")

          job = call("/api/generate", "POST", {"category": "props", "preset_id": "br_supply_crate", "quality_profile": "prototype", "seed": 7})
          for _ in range(90):
              cur = call(f"/api/jobs/{job['id']}")
              if cur["status"] in ("completed", "failed", "cancelled"):
                  break
              time.sleep(1)
          assert cur["status"] == "completed", cur
          asset = call(f"/api/jobs/{job['id']}/result")["asset"]
          with urllib.request.urlopen(f"http://127.0.0.1:8000{asset['glb_download_url']}", timeout=30) as resp:
              glb = resp.read()
          magic, version, length = struct.unpack("<III", glb[:12])
          assert magic == 0x46546C67 and version == 2 and length == len(glb) == asset["glb_size_bytes"]
          print(f"Docker smoke OK: {asset['glb_filename']} ({len(glb):,} bytes, engine={asset['blender_version']})")
          PY

      - name: Show container logs on failure
        if: failure()
        run: docker logs studio || true

      - name: Stop container
        if: always()
        run: docker rm -f studio || true

  # -------------------------------------------------------------------------
  blender-e2e:
    name: Blender 4.2 LTS Engine — Smoke, Sample GLB & Full E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install system OpenGL & X11 client runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1 libopengl0 libglx0 libglu1-mesa libxrender1 libxi6 libxkbcommon0 libsm6 libice6 libxxf86vm1 libxfixes3 libxt6 libxrandr2

      - name: Set up Python (pinned via .python-version)
        uses: actions/setup-python@v7
        with:
          python-version-file: ".python-version"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Create backend virtual environment & install dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip setuptools wheel
          .venv/bin/pip install --only-binary=:all: -r requirements-dev.txt

      - name: Set up isolated Blender 4.2.23 LTS runtime & GPL extensions
        env:
          GH_TOKEN: ${{ github.token }}
        run: .venv/bin/python scripts/setup_blender_runtime.py --runtime-dir "$HOME/.local/blender-runtime"

      - name: Run Blender background smoke test
        run: |
          BLENDER_PYTHON_EXECUTABLE="$HOME/.local/blender-runtime/bin/python" \
            .venv/bin/python scripts/smoke_test_blender.py

      - name: Generate & independently validate sample Rajasthani Haveli GLB (Blender)
        env:
          STUDIO_GENERATION_ENGINE: blender
        run: |
          mkdir -p ci_artifacts/sample_asset
          .venv/bin/python scripts/cli_generate.py \
            --engine blender \
            --category architecture \
            --preset rajasthani_haveli \
            --quality prototype \
            --seed 1727 \
            --asset-id ci_sample_rajasthani_haveli \
            --save-blend \
            --output-dir ci_artifacts/sample_asset

      - name: Run full automated pytest E2E suite (Blender engine)
        env:
          STUDIO_GENERATION_ENGINE: blender
        run: |
          mkdir -p ci_artifacts/reports
          .venv/bin/pytest --junitxml=ci_artifacts/reports/pytest-blender-junit.xml -v

      - name: Publish CI summary
        if: always()
        run: |
          echo "### Procedural 3D Asset Studio — Blender Engine Verification" >> "$GITHUB_STEP_SUMMARY"
          if [ -f ci_artifacts/sample_asset/ci_sample_rajasthani_haveli_metadata.json ]; then
            .venv/bin/python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          m = json.load(open("ci_artifacts/sample_asset/ci_sample_rajasthani_haveli_metadata.json"))
          print(f"- **Sample Asset**: {m['name']} (`{m['glb_filename']}`, {m['glb_size_bytes']:,} bytes)")
          print(f"- **Blender Version**: {m['blender_version']}")
          print(f"- **Measured Triangles**: {m['stats']['actual_triangles']:,}")
          print(f"- **Validation Passed**: {m['validation']['valid']}")
          PY
          fi

      - name: Upload test reports & generated sample GLB artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: blender-ci-reports-and-sample-glb
          path: |
            ci_artifacts/reports/pytest-blender-junit.xml
            ci_artifacts/sample_asset/*.glb
            ci_artifacts/sample_asset/*.blend
            ci_artifacts/sample_asset/*_metadata.json
          retention-days: 14

  # -------------------------------------------------------------------------
  # Optional GitHub Pages deployment of the static frontend.
  #
  # `actions/configure-pages` fails with
  #   HttpError: Not Found - "Get Pages site" failed
  # when GitHub Pages has not been enabled in the repository settings
  # (Settings → Pages → Build and deployment → Source: GitHub Actions).
  # That must NEVER red-flag the whole CI run: the configure step is
  # `continue-on-error`, deploy steps are gated on its outcome, and the
  # job itself is `continue-on-error` as a final safety net.
  # -------------------------------------------------------------------------
  pages:
    name: Deploy Frontend to GitHub Pages (optional)
    needs: frontend
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    continue-on-error: true
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend for GitHub Pages base path
        working-directory: frontend
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
          # Optional: set the repository variable PAGES_API_BASE_URL to a
          # live backend URL (e.g. your Render service) so the static
          # Pages studio can reach the generation API.
          VITE_API_BASE_URL: ${{ vars.PAGES_API_BASE_URL }}
        run: |
          npm ci
          npm run build

      - name: Configure GitHub Pages (tolerated when Pages is not enabled)
        id: pages_config
        uses: actions/configure-pages@v6
        continue-on-error: true
        with:
          enablement: true

      - name: Upload Pages artifact
        if: steps.pages_config.outcome == 'success'
        uses: actions/upload-pages-artifact@v5
        with:
          path: frontend/dist

      - name: Deploy to GitHub Pages
        id: deployment
        if: steps.pages_config.outcome == 'success'
        uses: actions/deploy-pages@v5

      - name: Explain skipped Pages deployment
        if: always() && steps.pages_config.outcome != 'success'
        run: |
          echo "### GitHub Pages deployment skipped (non-blocking)" >> "$GITHUB_STEP_SUMMARY"
          echo "GitHub Pages does not appear to be enabled for this repository yet, so \`actions/configure-pages\` could not find a Pages site (\`HttpError: Not Found\`)." >> "$GITHUB_STEP_SUMMARY"
          echo "To enable it: **Settings → Pages → Build and deployment → Source: GitHub Actions**, then re-run this workflow. All build/test jobs are unaffected." >> "$GITHUB_STEP_SUMMARY"
          echo "::warning::GitHub Pages is not enabled for this repository; skipping Pages deployment (CI remains green). Enable it under Settings → Pages → Source: GitHub Actions."
