[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "procedural-3d-asset-studio"
version = "1.1.0"
description = "100% code-driven Python 3D mid-poly procedural asset generator (NumPy, SciPy, Trimesh + optional Blender 4.2 LTS) with FastAPI and interactive Three.js Web Studio."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "GPL-3.0-or-later" }
dependencies = [
    "fastapi>=0.115.0,<1.0.0",
    "uvicorn[standard]>=0.34.0,<1.0.0",
    "pydantic>=2.10.0,<3.0.0",
    "pydantic-settings>=2.7.0,<3.0.0",
    "python-multipart>=0.0.18,<1.0.0",
    "httpx>=0.27.0,<1.0.0",
    "sqlalchemy>=2.0.30,<2.1.0",
    "aiosqlite>=0.20.0,<1.0.0",
    "numpy>=1.26.4,<2.0.0",
    "scipy>=1.11.4,<1.16.0",
    "trimesh>=4.0.0,<5.0.0",
    "networkx>=3.2,<4.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0,<9.0.0",
    "pytest-asyncio>=0.25.0,<1.0.0",
    "ruff>=0.11.0,<1.0.0",
]
blender = [
    "bpy>=4.2.0,<4.3.0",
    "numpy>=1.26.4,<2.0.0",
]
mesh = [
    "pymeshlab>=2023.12",
]

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]
